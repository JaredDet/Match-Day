name: matchday

x-backend: &backend
  image: matchday-backend:local
  build:
    context: .
  environment: &backend-environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-development}
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    DJANGO_PUBLIC_BASE_URL: http://localhost:8000
    DB_ENGINE: postgresql
    DB_NAME: ${POSTGRES_DB:-matchday}
    DB_USER: ${POSTGRES_USER:-matchday}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-matchday}
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media_data:/app/media
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchday}
      POSTGRES_USER: ${POSTGRES_USER:-matchday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchday}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  initialize:
    <<: *backend
    command: uv run --no-sync python manage.py migrate --noinput
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  seed-demo:
    <<: *backend
    command: >-
      sh -c "uv run --no-sync python manage.py seed_demo_match &&
      uv run --no-sync python manage.py seed_demo_tournament &&
      uv run --no-sync python manage.py seed_demo_news"
    depends_on:
      initialize:
        condition: service_completed_successfully
    profiles: ["demo"]
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  match-clock-worker:
    <<: *backend
    command: uv run --no-sync python manage.py run_match_clock_monitor
    depends_on:
      initialize:
        condition: service_completed_successfully

  news-worker:
    <<: *backend
    command: uv run --no-sync python manage.py publish_scheduled_news
    depends_on:
      initialize:
        condition: service_completed_successfully

  recommendations-worker:
    <<: *backend
    command: uv run --no-sync python manage.py run_recommendations_worker
    depends_on:
      initialize:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../matchday-ui
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8000/api
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
