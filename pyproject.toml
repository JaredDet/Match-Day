[project]
name = "matchday"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "injector>=0.24.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ShiftManagement"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
